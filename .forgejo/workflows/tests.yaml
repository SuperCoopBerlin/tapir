name: Run python tests

on: push

jobs:
  test:
    runs-on: codeberg-medium-lazy
    services:
      db:
        image: postgres:14
        env:
          POSTGRES_DB: tapir
          POSTGRES_PASSWORD: tapir
          POSTGRES_USER: tapir
      openldap:
        image: "osixia/openldap"
        env:
          LDAP_ORGANISATION: "SuperCoop Berlin"
          LDAP_DOMAIN: "supercoop.de"
          LDAP_ADMIN_PASSWORD: "admin"
          LDAP_READONLY_USER: "true"
      selenium:
        image: selenium/standalone-firefox-debug:latest
    steps:
      # Configuration
      - name: Install ubuntu packages
        run: apt-get update && apt-get install --no-install-recommends -y libpq-dev gettext libldap2-dev libsasl2-dev  libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 ldap-utils
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      # The file containing the ldap test data is in the repo and therefore only available after actions/checkout, which is only run after the services are started
      # That means we must import the ldap test data manually
      - name: Load LDAP test data
        run: ldapadd -x -H ldap://openldap:389 -D "cn=admin,dc=supercoop,dc=de" -w admin -f ldap_testdata.ldif

      # Poetry
      - name: Install poetry
        run: pip install poetry==2.4.1
      - name: Install poetry dependencies
        run: poetry install --no-root
      - name: Collect static files
        run: poetry run python manage.py collectstatic
      - name: Run poetry tests with DEBUG=1 variable
        env:
          DEBUG: 1
        run: poetry run pytest
openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /coop/member_self_register:
    post:
      operationId: coop_member_self_register_create
      tags:
      - coop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MemberRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MemberRegistrationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: string
          description: ''
  /shifts/solidarity_shifts/gifted_solidarity_shifts_json:
    get:
      operationId: shifts_solidarity_shifts_gifted_solidarity_shifts_json_retrieve
      tags:
      - shifts
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /shifts/solidarity_shifts/used_solidarity_shifts_json:
    get:
      operationId: shifts_solidarity_shifts_used_solidarity_shifts_json_retrieve

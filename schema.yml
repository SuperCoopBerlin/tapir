      operationId: statistics_co_purchasers_json_retrieve
      tags:
      - statistics
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /statistics/export_dataset:
    get:
      operationId: statistics_export_dataset_list
      description: Verify that the current user is authenticated.
      parameters:
      - in: query
        name: at_date
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: dataset
        schema:
          type: string
        required: true
      - in: query
        name: export_columns
        schema:
          type: array
          items:
            type: string
        required: true
      tags:
      - statistics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatapointExport'
          description: ''
  /statistics/financing_campaign_json/{id}:
    get:
      operationId: statistics_financing_campaign_json_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - statistics
      security:
      - cookieAuth: []
      responses:
        '200':

      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - statistics
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /welcomedesk/api/search:
    get:
      operationId: welcomedesk_api_search_list
      description: Verify that the current user is authenticated.
      parameters:
      - in: query
        name: search_input
        schema:
          type: string
        required: true
      tags:
      - welcomedesk
      security:

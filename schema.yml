          type: string
          format: date
        required: true
      - in: query
        name: dataset
        schema:
          type: string
        required: true
      - in: query
        name: relative
        schema:
          type: boolean
        required: true
      tags:
      - statistics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: integer
          description: ''
  /statistics/member_count_evolution_json:
